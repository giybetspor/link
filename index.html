<!DOCTYPE html>
<html>
<head>
    <title>Gıybetspor Yönlendirici</title>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        // Linkten video ID'sini çekiyoruz
        const urlParams = new URLSearchParams(window.location.search);
        const videoID = urlParams.get('v');

        if (videoID) {
            var appLink = "youtube://www.youtube.com/watch?v=" + videoID;
            var webLink = "https://www.youtube.com/watch?v=" + videoID;

            // Uygulamayı tetikle
            window.location.href = appLink;

            // Uygulama yoksa tarayıcıdan devam et
            setTimeout(function() {
                window.location.href = webLink;
            }, 2500);
        } else {
            document.body.innerHTML = '<h2 style="text-align:center; font-family:sans-serif; margin-top:50px;">Hata: Video ID bulunamadı!</h2>';
        }
    </script>
    <p id="msg" style="text-align:center; font-family:sans-serif; margin-top:50px;">
        YouTube Uygulaması Açılıyor
    </p>
</body>
</html>
