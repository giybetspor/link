<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Gıybetspor Youtube Kanalı</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: #ffcb70; text-align: center; }
        .loader { border: 4px solid #333; border-top: 4px solid #ffcb70; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #panelMode { background: #1e1e1e; padding: 30px; border-radius: 20px; border: 2px solid #ffcb70; width: 90%; max-width: 400px; display:none; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #333; background: #121212; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ffcb70; }
        button { background: #ffcb70; color: #121212; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e6b765; }
        #copyBtn { font-size: 12px; padding: 10px; margin-top: 10px; background: #333; color: #fff; }
        #copyBtn.success { background: #28a745; }
    </style>
</head>
<body>

<div id="redirectMode" style="display:none;">
    <h2 style="letter-spacing:2px; margin:0;">GIYBETSPOR</h2>
    <p style="color:#eee; font-size: 14px;">YouTube Uygulamasına Aktarılıyorsun</p>
    <div class="loader"></div>
</div>

<div id="panelMode">
    <h2 style="margin:0 0 10px 0;">🔗 Gıybetspor Link Üretici</h2>
    <input type="text" id="ytLink" placeholder="YouTube Linkini Buraya Yapıştır">
    <button onclick="generateLink()">Yeni Link Oluştur</button>
    
    <div id="resultArea" style="margin-top:20px; display:none; background:#2a2a2a; padding:15px; border-radius:10px; border:1px dashed #ffcb70;">
        <strong id="finalLink" style="font-size:12px; word-break:break-all; color:#ffcb70; font-family: monospace;"></strong><br>
        <button onclick="copyToClipboard()" id="copyBtn">Yeni Linki Kopyala</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoID = urlParams.get('v');
    const myBaseUrl = window.location.origin + window.location.pathname;

    if (videoID) {
        document.getElementById('panelMode').style.display = 'none';
        document.getElementById('redirectMode').style.display = 'block';
        
        const appUrl = "youtube://www.youtube.com/watch?v=" + videoID;
        const intentUrl = "intent://www.youtube.com/watch?v=" + videoID + "#Intent;package=com.google.android.youtube;scheme=https;end";
        const webUrl = "https://www.youtube.com/watch?v=" + videoID;

        window.location.replace(appUrl);
        setTimeout(function() { window.location.replace(intentUrl); }, 100);
        setTimeout(function() { window.location.replace(webUrl); }, 2000);
    } else {
        document.getElementById('panelMode').style.display = 'block';
    }

    function generateLink() {
        const input = document.getElementById('ytLink').value.trim();
        let id = "";
        if (input.includes("v=")) { id = input.split("v=")[1].split("&")[0]; }
        else if (input.includes("shorts/")) { id = input.split("shorts/")[1].split(/[?&]/)[0]; }
        else if (input.includes("live/")) { id = input.split("live/")[1].split(/[?&]/)[0]; }
        else if (input.includes("youtu.be/")) { id = input.split("youtu.be/")[1].split(/[?&]/)[0]; }

        if (id) {
            document.getElementById('finalLink').innerText = myBaseUrl + "?v=" + id;
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('copyBtn').innerText = "Yeni Linki Kopyala";
            document.getElementById('copyBtn').classList.remove('success');
        } else {
            alert("Geçersiz link!");
        }
    }

    function copyToClipboard() {
        const text = document.getElementById('finalLink').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "Yeni Link Kopyalandı! ✅";
            btn.classList.add('success');
        });
    }
</script>
</body>
</html>
