<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gıybetspor Link Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: white; }
        .panel { background: #1e1e1e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); width: 90%; max-width: 450px; text-align: center; border: 2px solid #ffcb70; }
        h2 { color: #ffcb70; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 1px solid #333; border-radius: 12px; background: #121212; color: white; font-size: 14px; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: #ffcb70; }
        button { background: #ffcb70; color: #121212; border: none; padding: 15px 25px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #e6b765; transform: translateY(-2px); }
        .result { margin-top: 25px; padding: 20px; background: #2a2a2a; border-radius: 12px; border: 1px dashed #ffcb70; display: none; animation: fadeIn 0.5s; }
        .final-link-text { color: #ffcb70; word-wrap: break-word; font-size: 14px; font-family: monospace; display: block; margin-bottom: 15px; }
        .copy-btn { background: #444; color: white; padding: 10px; font-size: 13px; border-radius: 8px; cursor: pointer; border:none; }
        .copy-btn.success { background: #28a745; }
        
        #redirectMode { text-align: center; display: none; }
        .spinner { border: 4px solid rgba(255, 203, 112, 0.1); border-top: 4px solid #ffcb70; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="redirectMode">
    <h2 style="color:#ffcb70;">Gıybetspor</h2>
    <p>YouTube Uygulaması Zorlanıyor...</p>
    <div class="spinner"></div>
</div>

<div id="panelMode" class="panel">
    <h2>🚀 LİNK ÜRETİCİ</h2>
    <input type="text" id="ytLink" placeholder="YouTube linkini buraya yapıştır">
    <button onclick="generateLink()">LİNK OLUŞTUR</button>
    
    <div id="resultArea" class="result">
        <strong id="finalLink" class="final-link-text"></strong>
        <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()">LİNKİ KOPYALA</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoID = urlParams.get('v');
    const myBaseUrl = window.location.origin + window.location.pathname;

    if (videoID) {
        document.getElementById('panelMode').style.display = 'none';
        document.getElementById('redirectMode').style.display = 'block';

        // 1. Yöntem: Standart Uygulama Protokolü (iOS ve Bazı Androidler)
        var appUrl = "youtube://www.youtube.com/watch?v=" + videoID;
        // 2. Yöntem: Android Intent (En Garanti Android Yöntemi)
        var intentUrl = "intent://www.youtube.com/watch?v=" + videoID + "#Intent;package=com.google.android.youtube;scheme=https;end";
        // 3. Yöntem: Web Yedek
        var webUrl = "https://www.youtube.com/watch?v=" + videoID;

        // Zincirleme Tetikleme
        window.location.href = appUrl;

        setTimeout(function() {
            window.location.href = intentUrl;
        }, 300);

        setTimeout(function() {
            window.location.href = webUrl;
        }, 2000);
    }

    function generateLink() {
        const input = document.getElementById('ytLink').value.trim();
        let id = "";
        
        if (input.includes("v=")) { id = input.split("v=")[1].split("&")[0]; }
        else if (input.includes("shorts/")) { id = input.split("shorts/")[1].split(/[?&]/)[0]; }
        else if (input.includes("live/")) { id = input.split("live/")[1].split(/[?&]/)[0]; }
        else if (input.includes("youtu.be/")) { id = input.split("youtu.be/")[1].split(/[?&]/)[0]; }

        if (id && id.length > 5) {
            const final = myBaseUrl + "?v=" + id;
            document.getElementById('finalLink').innerText = final;
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('copyBtn').innerText = "LİNKİ KOPYALA";
            document.getElementById('copyBtn').classList.remove('success');
        } else {
            alert("❌ Geçersiz link!");
        }
    }

    function copyToClipboard() {
        const text = document.getElementById('finalLink').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "KOPYALANDI! ✅";
            btn.classList.add('success');
        });
    }
</script>
</body>
</html>
