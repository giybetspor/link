<body>
    <script>
        // BURAYI DEGISTIR: Youtube video ID'ni tırnak içine yaz
        var videoID = "dQw4w9WgXcQ"; 

        var appLink = "youtube://www.youtube.com/watch?v=" + videoID;
        var webLink = "https://www.youtube.com/watch?v=" + videoID;

        // Uygulamayı tetikle
