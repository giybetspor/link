<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gıybetspor Link Oluşturma Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a1a; color: white; }
        .panel { background: #2d2d2d; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 450px; text-align: center; border: 1px solid #444; }
        h2 { color: #ff0000; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #444; border-radius: 10px; background: #1a1a1a; color: white; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ff0000; }
        button { background: #ff0000; color: white; border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #cc0000; transform: translateY(-2px); }
        .result { margin-top: 25px; padding: 15px; background: #3d3d3d; border-radius: 10px; border-left: 5px solid #ff0000; display: none; text-align: left; }
        .copy-btn { background: #007bff; margin-top: 10px; font-size: 12px; padding: 8px; }
    </style>
</head>
<body>

<div id="redirectMode" style="display:none;">
    <h2 style="color:white;">Gıybetspor Youtube Kanalına Bağlanıyor</h2>
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #ff0000; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto;"></div>
</div>

<div id="panelMode" class="panel" style="display:none;">
    <h2>🚀 Gıybetspor Link Üretici</h2>
    <p style="font-size: 13px; color: #aaa;">Gıybetspor Youtube video linkini yapıştır:</p>
    <input type="text" id="ytLink" placeholder="YouTube linkini buraya yapıştır">
    <button onclick="generateLink()">Link Oluştur</button>
    
    <div id="resultArea" class="result">
        <p style="font-size: 11px; color: #ccc; margin: 0 0 10px 0;">Yeni Gıybetspor Linki:</p>
        <strong id="finalLink" style="color:#00d4ff; word-wrap: break-word; font-size: 14px;"></strong>
    </div>
</div>

<style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoID = urlParams.get('v');
    const myBaseUrl = window.location.origin + window.location.pathname;

    if (videoID) {
        document.getElementById('redirectMode').style.display = 'block';
        // Uygulama ve Web linkleri
        var appLink = "youtube://www.youtube.com/watch?v=" + videoID;
        var webLink = "https://www.youtube.com/watch?v=" + videoID;
        
        window.location.href = appLink;
        setTimeout(function() { window.location.href = webLink; }, 2500);
    } else {
        document.getElementById('panelMode').style.display = 'block';
    }

    function generateLink() {
        const input = document.getElementById('ytLink').value.trim();
        let id = "";
        
        // GELİŞMİŞ AYIKLAMA MANTIĞI
        if (input.includes("v=")) {
            // Standart: youtube.com/watch?v=ID
            id = input.split("v=")[1].split("&")[0];
        } else if (input.includes("shorts/")) {
            // Shorts: youtube.com/shorts/ID
            id = input.split("shorts/")[1].split(/[?&]/)[0];
        } else if (input.includes("live/")) {
            // Canlı Yayın: youtube.com/live/ID
            id = input.split("live/")[1].split(/[?&]/)[0];
        } else if (input.includes("youtu.be/")) {
            // Mobil: youtu.be/ID
            id = input.split("youtu.be/")[1].split(/[?&]/)[0];
        } else if (input.includes("youtube.com/embed/")) {
            // Embed: youtube.com/embed/ID
            id = input.split("embed/")[1].split(/[?&]/)[0];
        } else if (input.includes("youtube.com/v/")) {
            // Eski tip: youtube.com/v/ID
            id = input.split("v/")[1].split(/[?&]/)[0];
        }

        if (id && id.length > 5) {
            const final = myBaseUrl + "?v=" + id;
            document.getElementById('finalLink').innerText = final;
            document.getElementById('resultArea').style.display = 'block';
        } else {
            alert("❌ Gıybetspor YouTube video ID'si bulunamadı! Lütfen geçerli bir video, shorts veya canlı yayın linki yapıştırın!");
        }
    }
</script>
</body>
</html>
