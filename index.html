<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gıybetspor</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: #ffcb70; text-align: center; }
        .loader { border: 4px solid #333; border-top: 4px solid #ffcb70; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #panelMode { background: #1e1e1e; padding: 30px; border-radius: 20px; border: 2px solid #ffcb70; width: 90%; max-width: 400px; display:none; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #333; background: #121212; color: white; box-sizing: border-box; }
        button { background: #ffcb70; color: #121212; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="redirectMode" style="display:none;">
    <h2 style="letter-spacing:2px;">GIYBETSPOR</h2>
    <p style="color:#eee;">YouTube Uygulamasına Aktarılıyorsun...</p>
    <div class="loader"></div>
</div>

<div id="panelMode">
    <h2>🚀 LİNK ÜRETİCİ</h2>
    <input type="text" id="ytLink" placeholder="YouTube Linkini Buraya Yapıştır">
    <button onclick="generateLink()">LİNK OLUŞTUR</button>
    <div id="resultArea" style="margin-top:20px; display:none; background:#2a2a2a; padding:15px; border-radius:10px; border:1px dashed #ffcb70;">
        <strong id="finalLink" style="font-size:12px; word-break:break-all; color:#ffcb70;"></strong><br><br>
        <button onclick="copyToClipboard()" id="copyBtn" style="font-size:12px; padding:8px;">LİNKİ KOPYALA</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoID = urlParams.get('v');
    const myBaseUrl = window.location.origin + window.location.pathname;

    if (videoID) {
        document.getElementById('panelMode').style.display = 'none';
        document.getElementById('redirectMode').style.display = 'block';
        
        const appUrl = "youtube://www.youtube.com/watch?v=" + videoID;
        const intentUrl = "intent://www.youtube.com/watch?v=" + videoID + "#Intent;package=com.google.android.youtube;scheme=https;end";
        const webUrl = "https://www.youtube.com/watch?v=" + videoID;

        // --- AGRESİF YÖNLENDİRME BAŞLAT ---
        
        // 1. Hamle: Standart Protokol Denemesi
        window.location.replace(appUrl);

        // 2. Hamle: 100ms sonra Android Intent (En Güçlü Android Silahı)
        setTimeout(function() {
            window.location.replace(intentUrl);
        }, 100);

        // 3. Hamle: Eğer hala buradaysak (Uygulama yoksa), 1.5 saniye sonra Web'e bırak
        setTimeout(function() {
            window.location.replace(webUrl);
        }, 1500);
    } else {
        document.getElementById('panelMode').style.display = 'block';
    }

    function generateLink() {
        const input = document.getElementById('ytLink').value.trim();
        let id = "";
        if (input.includes("v=")) { id = input.split("v=")[1].split("&")[0]; }
        else if (input.includes("shorts/")) { id = input.split("shorts/")[1].split(/[?&]/)[0]; }
        else if (input.includes("live/")) { id = input.split("live/")[1].split(/[?&]/)[0]; }
        else if (input.includes("youtu.be/")) { id = input.split("youtu.be/")[1].split(/[?&]/)[0]; }

        if (id) {
            document.getElementById('finalLink').innerText = myBaseUrl + "?v=" + id;
            document.getElementById('resultArea').style.display = 'block';
        }
    }

    function copyToClipboard() {
        const text = document.getElementById('finalLink').innerText;
        navigator.clipboard.writeText(text).then(() => {
            document.getElementById('copyBtn').innerText = "KOPYALANDI! ✅";
        });
    }
</script>
</body>
</html>
